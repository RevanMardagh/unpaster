name: release

on:
  push:
    tags: ["v*"]

# The release step creates a release and uploads assets, which is a write to
# the repository. Jobs get read-only access unless a permission is granted.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the version releases are smoke-tested with, so the
          # published binary and the tested one differ as little as possible.
          python-version: "3.13"

      # Before installing anything: a mislabelled tag should fail in seconds.
      # The tag arrives through the environment variable the runner already
      # sets. Interpolating ${{ github.ref_name }} would paste it into this
      # script before the shell runs it, and git allows ; & | $ ( ) in a ref
      # name, so a tag called v0.1.0;whoami would execute as two commands.
      - name: Check the tag matches the recorded version
        shell: pwsh
        run: python -m tools.check_version --tag "$env:GITHUB_REF_NAME"

      - name: Install the project and its dev tools
        run: python -m pip install -e ".[dev]"

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

      # assets/unpaster.ico is committed. Regenerate it with
      # `python -m tools.make_icon` when the drawing changes.
      - name: Build the executable
        run: python -m PyInstaller --clean --noconfirm unpaster.spec

      - name: Write the SHA256 checksum
        # Same format as sha256sum, so `sha256sum -c` verifies it as well as
        # PowerShell's Get-FileHash does.
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\unpaster.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  unpaster.exe" | Out-File dist\unpaster.exe.sha256 -Encoding ascii -NoNewline
          Write-Host "unpaster.exe  $hash"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/unpaster.exe
            dist/unpaster.exe.sha256
          generate_release_notes: true
          body: |
            Download `unpaster.exe` below. No installer or runtime required.

            **Verify it** against `unpaster.exe.sha256`:

            ```powershell
            Get-FileHash unpaster.exe -Algorithm SHA256 | Select-Object -ExpandProperty Hash
            ```

            **Windows will warn you.** The executable is unsigned and installs a low-level
            keyboard hook, so SmartScreen and some scanners flag it. Why that is
            unavoidable, and what to check instead:
            https://github.com/RevanMardagh/unpaster#windows-will-warn-you

            Settings and snippets are written to `%APPDATA%\unpaster\`
