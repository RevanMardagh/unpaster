name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    # Windows only: every module reaches Windows APIs through ctypes.
    runs-on: windows-latest

    strategy:
      fail-fast: false
      # 3.12 is the declared minimum; 3.13 is what releases are built with.
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project and its dev tools
        run: python -m pip install -e ".[dev]"

      - name: Run the test suite
        # The runner has no interactive desktop, so Qt renders offscreen.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
