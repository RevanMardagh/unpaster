[project]
name = "unpaster"
version = "0.1.0"
description = "Types stored or entered text into RDP/VNC sessions where clipboard paste does not work"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["unpaster*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
