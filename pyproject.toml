[project]
name = "unpaster"
version = "0.1.1"
description = "Types stored or entered text into RDP/VNC sessions where clipboard paste does not work"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7"]
# GPL-3.0-or-later, not GPL-2.0: PySide6 and Qt are LGPL-3.0, which cannot be
# combined with a GPL-2.0-only work.
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.6", "PyYAML>=6.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["unpaster*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
